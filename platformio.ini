; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./src-platformio

[env:mini-vario]
platform = espressif32
board = m5stack-grey
framework = arduino
monitor_speed = 115200
board_build.partitions = ./src-platformio/mini_vario.csv

build_flags =
	-DUSE_GOOD_DISPLAY=0
	-DUSE_DRIVER_TEMPLATE=1
	-DUSE_ASYNCWEBSERVER=1
	-DASYNCWEBSERVER_REGEX=1
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-DBOARD_HAS_PSRAM=1
	-mfix-esp32-psram-cache-issue
	-I./src-platformio/include

lib_deps =
	bblanchon/ArduinoJson@^6.19.4
	https://github.com/Hieromon/AutoConnect.git@1.4.2
	https://github.com/Hieromon/PageBuilder.git@1.5.6
	esphome/AsyncTCP-esphome@^2.0.1
	ottowinter/ESPAsyncWebServer-esphome@^3.1.0
lib_extra_dirs = ./src-platformio/lib